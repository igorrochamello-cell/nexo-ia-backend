<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PipeNexo CRM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 32px;
      color: #667eea;
      margin-bottom: 8px;
    }

    .logo p {
      font-size: 14px;
      color: #999;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .submit-btn {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 20px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .test-credentials {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #eee;
      font-size: 13px;
      color: #666;
    }

    .test-credentials p {
      margin-bottom: 8px;
    }

    .test-credentials code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      color: #333;
    }

    .test-account {
      background: #f9f9f9;
      padding: 12px;
      border-radius: 6px;
      margin: 8px 0;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>PipeNexo</h1>
      <p>CRM para Seguros</p>
    </div>

    <form id="loginForm">
      <div class="error-message" id="errorMessage"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        Entrar
      </button>
    </form>

    <div class="test-credentials">
      <p><strong>Credenciais de Teste:</strong></p>

      <div class="test-account">
        <strong>Empresa 1 - PipeNexo Inc</strong><br/>
        Admin: <code>admin@pipenexo.test</code><br/>
        Senha: <code>TestPassword123!</code>
      </div>

      <div class="test-account">
        <strong>Empresa 2 - Seguros Brasil SA</strong><br/>
        Admin: <code>admin@seguros-brasil.test</code><br/>
        Senha: <code>TestPassword123!</code>
      </div>

      <p style="margin-top: 12px; font-size: 11px; color: #999;">
        Execute <code>npm run seed</code> para popular o banco com dados de teste.
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const api = new ApiService();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const errorDiv = document.getElementById('errorMessage');

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-spinner"></span>Entrando...';
      errorDiv.classList.remove('show');

      try {
        await api.login(email, password);
        // Redirect to dashboard on successful login
        window.location.href = '/app/dashboard.html';
      } catch (error) {
        errorDiv.textContent = error.message || 'Erro ao fazer login. Tente novamente.';
        errorDiv.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Entrar';
      }
    });

    // Redirect if already logged in
    if (api.isAuthenticated()) {
      window.location.href = '/app/dashboard.html';
    }
  </script>
</body>
</html>
